<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="624" viewBox="0 0 1080 624" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1080" height="624" fill="#ffffff"/>

  <text x="20" y="32" font-size="18" font-weight="bold">priorityarena receiver</text>
  <text x="20" y="52" font-size="13" fill="#57606a">Every buffered request is held as bytes in one arena outside the Go heap, and admitted on exact block counts.</text>

  <!-- the sender -->
  <rect x="20" y="168" width="124" height="80" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="82" y="190" text-anchor="middle" font-weight="bold" font-size="13">Service SDK</text>
  <text x="82" y="208" text-anchor="middle">OTLP/gRPC, one</text>
  <text x="82" y="223" text-anchor="middle">class per request:</text>
  <text x="82" y="238" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11">hp | lp header</text>
  <line x1="144" y1="208" x2="166" y2="208" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- the receiver -->
  <rect x="168" y="66" width="572" height="268" rx="8" fill="none" stroke="#8c959f"/>
  <text x="182" y="86" font-weight="bold" font-size="13">receiver</text>

  <rect x="184" y="96" width="190" height="58" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="196" y="115" font-weight="bold">1  Tap</text>
  <text x="196" y="131">refuse from the header,</text>
  <text x="196" y="146">before reading the body</text>
  <line x1="279" y1="154" x2="279" y2="165" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="184" y="166" width="190" height="58" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="196" y="185" font-weight="bold">2  Scan</text>
  <text x="196" y="201">count spans, check the</text>
  <text x="196" y="216">wire structure; no decode</text>
  <line x1="279" y1="224" x2="279" y2="235" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="184" y="236" width="190" height="86" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="196" y="255" font-weight="bold">3  Admit</text>
  <text x="196" y="271">copy into whole blocks;</text>
  <text x="196" y="286">LP below the LP limit,</text>
  <text x="196" y="301">checkpoints into free</text>
  <text x="196" y="316">blocks or by eviction</text>
  <line x1="374" y1="279" x2="391" y2="279" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="392" y="96" width="160" height="226" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="472" y="116" text-anchor="middle" font-weight="bold" font-size="13">Arena</text>
  <text x="472" y="133" text-anchor="middle" font-size="11" fill="#57606a">off-heap (mmap)</text>
  <text x="472" y="147" text-anchor="middle" font-size="11" fill="#57606a">4 KiB blocks</text>
  <rect x="406" y="160" width="132" height="50" rx="4" fill="#fbe3cc" stroke="#d9822b"/>
  <text x="472" y="181" text-anchor="middle" font-weight="bold">checkpoints</text>
  <text x="472" y="198" text-anchor="middle" font-size="11">FIFO</text>
  <rect x="406" y="220" width="132" height="50" rx="4" fill="#d6e6f7" stroke="#3b78c3"/>
  <text x="472" y="241" text-anchor="middle" font-weight="bold">LP</text>
  <text x="472" y="258" text-anchor="middle" font-size="11">FIFO</text>
  <text x="472" y="290" text-anchor="middle" font-size="11" fill="#57606a">eviction takes the</text>
  <text x="472" y="304" text-anchor="middle" font-size="11" fill="#57606a">newest LP first</text>
  <line x1="552" y1="209" x2="569" y2="209" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="570" y="128" width="156" height="162" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="582" y="148" font-weight="bold">4  Dispatch</text>
  <text x="582" y="168">checkpoints first;</text>
  <text x="582" y="184">LP only while no</text>
  <text x="582" y="200">checkpoint waits;</text>
  <text x="582" y="216">requests batched</text>
  <text x="582" y="232">by concatenation;</text>
  <text x="582" y="248">blocks freed only</text>
  <text x="582" y="264">once delivered</text>

  <path d="M648,290 V348 H305" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <line x1="305" y1="348" x2="305" y2="361" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="601" y1="348" x2="601" y2="361" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="168" y="362" width="276" height="62" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="180" y="382" font-weight="bold">Forward mode (agents)</text>
  <text x="180" y="398">sends the bytes on, no decode;</text>
  <text x="180" y="414">gRPC reads the arena blocks</text>
  <rect x="464" y="362" width="276" height="62" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="476" y="382" font-weight="bold">Pipeline mode (gateway)</text>
  <text x="476" y="398">decodes each batch into the</text>
  <text x="476" y="414">pipeline; the exporter must not queue</text>

  <!-- admission rules -->
  <rect x="758" y="66" width="302" height="268" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="772" y="88" font-weight="bold" font-size="13">Admission, per request</text>
  <rect x="772" y="100" width="10" height="10" fill="#d6e6f7" stroke="#3b78c3"/>
  <text x="790" y="109" font-weight="bold">LP</text>
  <text x="772" y="127">admitted while the blocks in use, plus</text>
  <text x="772" y="142">its own, stay within the LP limit;</text>
  <text x="772" y="157">otherwise refused (ResourceExhausted)</text>
  <rect x="772" y="172" width="10" height="10" fill="#fbe3cc" stroke="#d9822b"/>
  <text x="790" y="181" font-weight="bold">Checkpoint</text>
  <text x="772" y="199">admitted into free blocks; when there</text>
  <text x="772" y="214">are none, the newest LP is evicted,</text>
  <text x="772" y="229">queued first, then in flight;</text>
  <text x="772" y="244">refused (Unavailable) only when no LP</text>
  <text x="772" y="259">is left to evict</text>
  <text x="772" y="284" fill="#57606a">Memory is counted, not sampled: no</text>
  <text x="772" y="299" fill="#57606a">GC-driven thresholds, no forced GC.</text>
  <text x="772" y="314" fill="#57606a">Moving the LP limit evicts nothing.</text>

  <!-- memory layout -->
  <text x="20" y="464" font-weight="bold" font-size="13">Memory of one collector, as a share of its container's limit (example: r = 1.4)</text>
  <rect x="20" y="478" width="582.4" height="40" fill="#d6e6f7"/>
  <rect x="602.4" y="478" width="145.6" height="40" fill="#fbe3cc"/>
  <rect x="748" y="478" width="312" height="40" fill="#e7e9ec"/>
  <rect x="20" y="478" width="1040" height="40" fill="none" stroke="#8c959f"/>
  <text x="311.2" y="503" text-anchor="middle" font-weight="bold">LP and checkpoints</text>
  <text x="675.2" y="503" text-anchor="middle" font-weight="bold">checkpoints only</text>
  <text x="904" y="503" text-anchor="middle">Go heap, gRPC buffers</text>
  <line x1="602.4" y1="472" x2="602.4" y2="546" stroke="#1f2328" stroke-width="1.5"/>
  <line x1="748" y1="472" x2="748" y2="546" stroke="#1f2328" stroke-width="1.5"/>
  <text x="20" y="536" fill="#57606a">0 %</text>
  <text x="1060" y="536" text-anchor="end" fill="#57606a">100 %</text>
  <text x="596" y="560" text-anchor="end" font-weight="bold">LP limit: 70 % − band = 56 %</text>
  <text x="754" y="560" font-weight="bold">arena top: memory_percentage, 70 %</text>
  <text x="20" y="590">band = checkpoint_reserve_percentage × max(1, r) = 10 % × 1.4 = 14 %</text>
  <text x="20" y="608">r = checkpoint bytes per span ÷ LP bytes per span, measured on admitted requests over the last 30 s</text>
</svg>
