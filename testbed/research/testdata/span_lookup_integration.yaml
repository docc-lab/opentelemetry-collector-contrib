receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "localhost:4317"
      http:
        endpoint: "localhost:4318"

processors:
  spanreconstruction:
    max_active_spans: 1000
    ttl: 300s
  spanlookup:
    max_lookups: 100
    enable_metrics: true

exporters:
  otlp:
    endpoint: "localhost:4317"
    tls:
      insecure: true
  logging:
    loglevel: debug

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [spanreconstruction]
      exporters: [otlp, logging]
    traces2:
      receivers: [otlp]
      processors: [spanlookup]
      exporters: [logging] 