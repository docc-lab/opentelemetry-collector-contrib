receivers:
  # High priority OTLP receiver
  otlp/highprio:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  configdiscovery:
    endpoint: ":8080"
    config_map:
      # Checkpoint distance (cpd) - determines how often spans are checkpointed
      # Priority is high if depth % cpd == 0 (root span at depth 0 is always checkpointed)
      cpd: 3
      # Add other config properties here as needed
      # Example nested map:
      # nested_config:
      #   key1: value1
      #   key2: value2
      # Example array:
      # some_array: [item1, item2, item3]
    
  # # Low priority OTLP receiver
  # otlp/lowprio:
  #   protocols:
  #     grpc:
  #       endpoint: 0.0.0.0:4319
  #     http:
  #       endpoint: 0.0.0.0:4320

processors:
  priority:
    memory_limit_percentage: 50
    burst_memory_limit_percentage: 80
    check_interval: 200ms

exporters:
  # Debug exporter for development and testing
  debug:
    verbosity: detailed
  
  # OTLP exporter for sending processed spans to downstream systems
  otlp:
    endpoint: "http://localhost:4317"
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: DEBUG
  
  # Priority-based pipelines
  pipelines:
    # # High priority pipeline - receives from port 4317/4318
    # traces/highprio:
    #   receivers: [otlp/highprio]
    #   processors: []
    #   exporters: [otlp, debug]
    
    # # Low priority pipeline - receives from port 4319/4320
    # traces/lowprio:
    #   receivers: [otlp/lowprio]
    #   processors: []
    #   exporters: [otlp, debug]
    traces:
      # receivers: [otlp/highprio, otlp/lowprio]
      receivers: [otlp/highprio]
      processors: [priority]
      exporters: [otlp, debug]
    
    # Config discovery receiver pipeline - starts the HTTP server for config discovery
    # This receiver doesn't consume logs, it only provides HTTP endpoints
    logs/configdiscovery:
      receivers: [configdiscovery]
      processors: []
      exporters: [debug]
  
  # Extensions for additional functionality
  extensions: []
