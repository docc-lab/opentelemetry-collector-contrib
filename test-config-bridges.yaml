receivers:
  otlp/highprio:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        include_metadata: true        # propagates "bridges-priority" header into ctx
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true

  configdiscovery:
    endpoint: ":8080"
    config_map:
      cpd: 3

processors:
  # Priority processor — pass-through architecture.
  #
  # This processor does NOT buffer. It reads the "bridges-priority"
  # gRPC metadata header (set per-batch by the SB SDK) and the current
  # alloc-vs-threshold pressure state, then either passes the batch
  # straight through to the next consumer or returns gRPC Unavailable
  # to the SDK. In-flight memory is bounded by the downstream otlp
  # exporter's sending_queue (queue_size × send_batch_size), exactly
  # like the vanilla / memory_limiter pipeline.
  #
  # Admission matrix:
  #   NoPressure (alloc < low)        → admit all
  #   Low        (low ≤ alloc < mid)  → admit HP; refuse LP
  #   Mid/High   (alloc ≥ mid)        → refuse all
  priority:
    low_percentage:         40
    mid_percentage:         60
    high_percentage:        80
    check_interval:         100ms

exporters:
  # Debug exporter removed from the TRACES pipeline: its default
  # queue_capacity=1 was the source of "silent drops" we previously
  # mis-attributed to jaeger-bound loss. The configdiscovery logs
  # pipeline keeps using it (every otelcol pipeline needs ≥1 exporter,
  # and configdiscovery is dev-only so the tiny-queue drops don't matter).
  debug:
    verbosity: detailed

  # otlp exporter owns the in-flight buffer via sending_queue. With the
  # priority processor now pass-through, this is where in-flight memory
  # is bounded — same architecture as the vanilla/memory_limiter
  # pipeline.
  otlp:
    endpoint: ${JAEGER_SBREV0_OTLP_DIAL_ADDR}
    tls:
      insecure: true
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0

service:
  telemetry:
    logs:
      level: DEBUG

  pipelines:
    traces:
      receivers:  [otlp/highprio]
      processors: [priority]
      exporters:  [otlp]

    logs/configdiscovery:
      receivers:  [configdiscovery]
      processors: []
      exporters:  [debug]

  extensions: []
