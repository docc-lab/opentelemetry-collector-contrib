  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.139.1-0.20251106125304-a6a176660925
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.139.1-0.20251106125304-a6a176660925

