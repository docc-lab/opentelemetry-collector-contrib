# Tomislav-RetCtx: a small collector with the components the priority pipelines use, for
# comparing them on identical binaries (old: priorityotlp -> priority -> batch -> priority/queue
# -> otlp; new: priorityarena). Build with ./build.sh; see the README in
# processor/priorityprocessor/priorityarenareceiver.
dist:
  module: github.com/open-telemetry/opentelemetry-collector-contrib/cmd/prioritycol
  name: prioritycol
  description: Priority pipeline test collector.
  version: 0.139.0-dev
  output_path: ./cmd/prioritycol

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/headerssetterextension v0.139.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.139.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.139.1-0.20251106125304-a6a176660925
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/configdiscoveryreceiver v0.139.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/priorityprocessor v0.139.0
    import: github.com/open-telemetry/opentelemetry-collector-contrib/processor/priorityprocessor/priorityotlpreceiver
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/priorityprocessor v0.139.0
    import: github.com/open-telemetry/opentelemetry-collector-contrib/processor/priorityprocessor/priorityarenareceiver

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.139.1-0.20251106125304-a6a176660925
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.139.1-0.20251106125304-a6a176660925
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/priorityprocessor v0.139.0

exporters:
