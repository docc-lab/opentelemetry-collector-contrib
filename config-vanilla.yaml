receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # Debug exporter for development and testing
  debug:
    verbosity: detailed
  
  # OTLP exporter for sending processed spans to downstream systems
  otlp:
    endpoint: "http://localhost:4317"
    tls:
      insecure: true

processors:
  batch:

service:
  telemetry:
    logs:
      level: DEBUG
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,otlp]